<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline to Gantt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel input-panel">
        <header>
          <h1>Text Timeline to Gantt Chart</h1>
          <p>Write one task per line using this format:</p>
          <code>Task Name | YYYY-MM-DD | YYYY-MM-DD | Optional Group</code>
        </header>
        <textarea id="timelineInput" spellcheck="false" aria-label="Timeline input"></textarea>
        <div class="controls">
          <label class="control-inline" for="pageOrientation">
            <span class="control-inline-label">A4</span>
            <select id="pageOrientation" aria-label="A4 page orientation">
              <option value="portrait" selected>Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </label>
          <label class="control-inline" for="fontScale">
            <span class="control-inline-label">Text</span>
            <select id="fontScale" aria-label="Chart text size">
              <option value="0.78">Small</option>
              <option value="1" selected>Medium</option>
              <option value="1.15">Large</option>
              <option value="1.32">Extra large</option>
            </select>
          </label>
          <label class="control-inline control-checkbox" for="showGroups">
            <input type="checkbox" id="showGroups" checked />
            <span>Groups</span>
          </label>
          <div class="control-shades" role="group" aria-label="Alternating row background colors">
            <span class="control-inline-label">Rows</span>
            <label class="shade-field" for="tableHex1">
              <input type="color" id="tableColor1" value="#fffdf8" title="Pick shade A" aria-label="Row shade A (picker)" />
              <input type="text" id="tableHex1" class="hex-input" maxlength="9" spellcheck="false" inputmode="text" aria-label="Row shade A hex" />
            </label>
            <label class="shade-field" for="tableHex2">
              <input type="color" id="tableColor2" value="#f8f5ef" title="Pick shade B" aria-label="Row shade B (picker)" />
              <input type="text" id="tableHex2" class="hex-input" maxlength="9" spellcheck="false" inputmode="text" aria-label="Row shade B hex" />
            </label>
          </div>
          <button id="renderButton" type="button">Render Chart</button>
          <button id="exampleButton" type="button" class="ghost">Load Example</button>
          <button id="copyButton" type="button" class="ghost">Copy Image</button>
          <button id="downloadButton" type="button" class="ghost">Download PNG (Hi-Res)</button>
        </div>
        <p id="statusMessage" role="status" aria-live="polite"></p>
      </section>

      <section class="panel chart-panel">
        <div id="chartHost" class="chart-host" aria-label="Gantt chart output"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
